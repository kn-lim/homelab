clusters:
    ## Cluster Name
  - name: "henesys"

    ## Talos Version
    talos_version: "v1.14.4"

    ## Kubernetes Version
    kubernetes_version: "v1.37.1"

    ## NVIDIA GPU Support
    nvidia_gpu_enabled: true

    ## Talos System Extensions
    system_extensions:
      - siderolabs/qemu-guest-agent

    ## Virtiofs Volumes
    virtiofs_volumes:
      - kubernetes-array
      - kubernetes-data
      - media

    ## Cluster Endpoint IP
    endpoint: "https://talos.henesys.knlim.dev:6443"

    ## Cluster DNS Server IP
    dns_server: "1.1.1.3"

    ## Cluster DNS Gateway IP
    gateway: "10.1.2.1"

    ## Network Interface Hardware MAC Address
    hardware_addr: "52:54:00:fe:bd:6a"

    ## Control Plane Nodes
    controlplanes:
        ## Node IP Address
      - ip: "10.1.2.11"

        ## Node Install Disk
        install_disk: "/dev/vda"

        ## Node Hostname
        hostname: "henesys"

    ## Node Subnet CIDR
    node_subnet: "10.1.2.0/24"

    ## Service Subnet CIDR
    service_subnet: "10.96.0.0/16"

    ## Pod Subnet CID
    pod_subnet: "10.244.0.0/16"

    ## 1Password Vault Name
    vault_name: "Homelab"

    ## External Secrets
    external_secrets:
        ## 1Password SDK
      - onepassword:
          - vault_name: "Homelab"
            namespace: "external-secrets"
            secret_name: "op-sa-kubernetes"
            token_secret_name: "onepassword-token"

    ## Tailscale Tailnet Name
    tailscale_tailnet_name: "neon-wyrm"

    ## Tailscale Nameserver IP
    tailscale_nameserver_ip: "10.96.0.53"

    ## CoreDNS Cluster IP
    coredns_cluster_ip: "10.96.0.10"

    ## Prometheus Remote Write URL
    prometheus_remote_write_url: "http://prometheus-server.observability.svc.cluster.local:80/api/v1/write"

    ## Local Domain
    local_domain: "knlim.dev"

    ## Local VIP
    local_vip: "10.1.2.12"

    ## democratic-csi Data Path
    democratic_csi_data_path: "/var/mnt/kubernetes-data/democratic-csi"

    ## Velero S3 URL
    velero_s3_url: "http://versitygw.storage.svc.cluster.local:7070"

    ## Cluster Name
  - name: "ellinia"

    ## Talos Version
    talos_version: "v1.14.4"

    ## Kubernetes Version
    kubernetes_version: "v1.37.1"

    ## NVIDIA GPU Support
    nvidia_gpu_enabled: false

    ## Talos System Extensions
    system_extensions:
      - siderolabs/amd-ucode

    ## Directory Volumes
    directory_volumes:
      - democratic-csi

    ## Cluster Endpoint IP
    endpoint: "https://talos.ellinia.knlim.dev:6443"

    ## Cluster DNS Server IP
    dns_server: "1.1.1.3"

    ## Cluster DNS Gateway IP
    gateway: "10.1.2.1"

    ## Network Interface Hardware MAC Address
    hardware_addr: "a0:ce:c8:ce:86:1e"

    ## Control Plane Nodes
    controlplanes:
        ## Node IP Address
      - ip: "10.1.2.20"

        ## Node Install Disk
        install_disk: "/dev/nvme0n1"

        ## Node Hostname
        hostname: "ellinia"

    ## Node Subnet CIDR
    node_subnet: "10.1.2.0/24"

    ## Service Subnet CIDR
    service_subnet: "10.96.0.0/16"

    ## Pod Subnet CID
    pod_subnet: "10.244.0.0/16"

    ## 1Password Vault Name
    vault_name: "Homelab"

    ## External Secrets
    external_secrets:
        ## 1Password SDK
      - onepassword:
          - vault_name: "Homelab"
            namespace: "external-secrets"
            secret_name: "op-sa-kubernetes"
            token_secret_name: "onepassword-token"

    ## Tailscale Tailnet Name
    tailscale_tailnet_name: "neon-wyrm"

    ## Tailscale Nameserver IP
    tailscale_nameserver_ip: "10.96.0.53"

    ## CoreDNS Cluster IP
    coredns_cluster_ip: "10.96.0.10"

    ## Prometheus Remote Write URL
    prometheus_remote_write_url: "https://prometheus.neon-wyrm.ts.net/api/v1/write"

    ## Local Domain
    local_domain: "ellinia.knlim.dev"

    ## Local VIP
    local_vip: "10.1.2.21"

    ## democratic-csi Data Path
    democratic_csi_data_path: "/var/mnt/democratic-csi"

    ## Velero S3 URL
    velero_s3_url: "https://versitygw.knlim.dev"

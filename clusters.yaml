clusters:
    ## Cluster Name
  - name: "homelab"

    ## Talos Version
    # talos_version: ""

    ## Kubernetes Version
    # kubernetes_version: ""

    ## NVIDIA GPU Support
    nvidia_gpu_enabled: true

    ## Cluster Endpoint IP
    endpoint: "https://talos.homelab.knlim.dev:6443"

    ## Cluster DNS Server IP
    dns_server: "1.1.1.3"

    ## Cluster DNS Gateway IP
    gateway: "10.1.2.1"

    ## Cluster Network Interface Name
    network_interface: "enp3s0"

    ## Control Plane Nodes
    controlplanes:
        ## Node IP Address
      - ip: "10.1.2.11"

        ## Node Install Disk
        install_disk: "/dev/vda"

        ## Node Hostname
        hostname: "homelab-talos"

    ## Node Subnet CIDR
    node_subnet: "10.1.2.0/24"

    ## Service Subnet CIDR
    service_subnet: "10.96.0.0/16"

    ## Pod Subnet CID
    pod_subnet: "10.244.0.0/16"

    ## 1Password Vault Name
    vault_name: "Homelab"

    ## External Secrets
    external_secrets:
        ## 1Password SDK
      - onepassword:
          - vault_name: "Homelab"
            namespace: "external-secrets"
            secret_name: "op-sa-kubernetes"
            token_secret_name: "onepassword-token"

    ## Tailscale Tailnet Name
    tailscale_tailnet_name: "neon-wyrm"

    ## Tailscale Nameserver IP
    tailscale_nameserver_ip: "10.96.242.88"

    ## CoreDNS Cluster IP
    coredns_cluster_ip: "10.96.0.10"

    ## Local Domain
    local_domain: "knlim.dev"

    ## Local VIP
    local_vip: "10.1.2.12"

    ## Local Services
    local_services:
      - jellyfin
      - traefik

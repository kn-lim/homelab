[env]
KUBECONFIG = "{{config_root}}/henesys-local.kubeconfig:{{config_root}}/ellinia-local.kubeconfig"
TALOSCONFIG = "{{config_root}}/henesys-local.talosconfig"

[tools]
"aqua:1password/cli" = "2.41.0"
"aqua:aws/aws-cli" = "2.38.5"
"aqua:fluxcd/flux2" = "2.9.6"
"aqua:gruntwork-io/terragrunt" = "1.1.6"
"aqua:hairyhenderson/gomplate" = "5.3.1"
"aqua:hashicorp/terraform" = "1.17.0"
"aqua:helm/helm" = "4.3.1"
"aqua:helmfile/helmfile" = "1.8.2"
"aqua:j178/prek" = "0.5.7"
"aqua:jqlang/jq" = "1.8.1"
"aqua:kubernetes-sigs/kustomize" = "5.8.3"
"aqua:kubernetes/kubernetes/kubectl" = "1.37.1"
"aqua:mikefarah/yq" = "4.54.1"
"aqua:siderolabs/talos" = "1.14.4"
"aqua:terraform-docs/terraform-docs" = "0.24.0"
"aqua:terraform-linters/tflint" = "0.64.0"
"aqua:trufflesecurity/trufflehog" = "3.99.2"
"aqua:vmware-tanzu/velero" = "1.18.4"
"github:fluxcd/flux-schema" = "0.16.0"
"github:home-operations/flate" = "0.6.5"

[tasks."flux:reconcile"]
description = "Reconcile a Flux Kustomization with its source. Default: flux-system"
usage = '''
arg "<cluster>" help="The cluster to reconcile" {
  choices "henesys" "ellinia"
}
arg "[kustomization]" help="The Kustomization in flux-system to reconcile" default="flux-system"
'''
run = 'flux --context "admin@${usage_cluster}" reconcile kustomization "${usage_kustomization}" --with-source'

[tasks."template:clean"]
description = "Delete all generated directories"
run = 'find . -type d -name generated -prune -printf "Deleting: %p\n" -exec rm -rf {} +'

[tasks."terraform:plan"]
description = "Plan a Terragrunt stack"
usage = 'arg "<dir>" help="The stack directory, for example terraform/henesys/local/talos/generated"'
run = 'cd "${usage_dir}" && terragrunt stack run plan'

[tasks."terraform:apply"]
description = "Apply a Terragrunt stack with no Terragrunt prompt"
usage = 'arg "<dir>" help="The stack directory, for example terraform/henesys/local/talos/generated"'
confirm = "Apply the Terragrunt stack in {{usage.dir}}?"
run = 'cd "${usage_dir}" && terragrunt stack run apply --non-interactive'

[tasks."utilities:prek"]
description = "Run the prek hooks on all files"
run = "prek run --all-files"

[tasks."utilities:clean"]
description = "Delete all .terragrunt-stack directories"
run = 'find . -type d -name .terragrunt-stack -prune -printf "Deleting: %p\n" -exec rm -rf {} +'

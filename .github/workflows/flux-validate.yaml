---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Flux Validate"

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Flux Validate - Filter
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # no checkout, so changed files come from the pull request API
    outputs:
      any-changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            .github/workflows/flux-validate.yaml
            .mise.toml
            .mise/tasks/flux/**
            kubernetes/**/*

  validate:
    if: ${{ needs.filter.outputs.any-changed == 'true' }}
    needs: filter
    name: Flux Validate - ${{ matrix.cluster }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # authenticated GHCR pulls avoid the shared anonymous rate limit
    strategy:
      fail-fast: false
      matrix:
        cluster:
          - henesys
          - ellinia
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: >-
            aqua:kubernetes-sigs/kustomize
            aqua:mikefarah/yq
            github:fluxcd/flux-schema
            github:home-operations/flate

      - name: Log In to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Run Flux Validate
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false" # use only the tools from the Install Tools step
        run: FLATE_REGISTRY_CONFIG="${HOME}/.docker/config.json" mise run flux:validate ${{ matrix.cluster }}

  success:
    if: ${{ !cancelled() }}
    needs: [filter, validate]
    name: Flux Validate - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"

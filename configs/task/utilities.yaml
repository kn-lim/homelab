# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  clean:
    desc: Deletes all ignored directories
    vars:
      DIRS: [charts, .terragrunt-stack]
    cmds:
      - for:
          var: DIRS
        cmd: 'find . -type d -name "{{ .ITEM }}" -prune -printf "Deleting: %p\n" -exec rm -rf {} +'
    dir: "{{ .ROOT_DIR }}"

  pre-commit:
    desc: Runs pre-commit on all files
    aliases: [pc]
    cmd: 'pre-commit run --all-files'

  wiki-sync:
    desc: Force syncs the otterwiki repository with GitHub
    vars:
      JOB_NAME: otterwiki-sync-manual-{{ now.Unix }}
    cmds:
      - kubectl -n otterwiki create job --from=cronjob/otterwiki-sync {{ .JOB_NAME }}
      - kubectl -n otterwiki wait --for=condition=complete --timeout=120s job/{{ .JOB_NAME }}
      - kubectl -n otterwiki logs job/{{ .JOB_NAME }}
      - kubectl -n otterwiki delete job {{ .JOB_NAME }}

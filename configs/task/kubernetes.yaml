# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

# Input Variables:
#   DIR:       User provided directory to run the kubernetes task commands in
#   NAMESPACE: (Optional) Namespace to ensure exists before applying
#   CONTEXT:   (Optional) kubectl context to target (e.g. admin@homelab-lenovo); defaults to the current context

vars:
  KUBECTL: 'kubectl{{if .CONTEXT}} --context {{.CONTEXT}}{{end}}'

tasks:
  _ensure-namespace:
    internal: true
    run: once
    cmds:
      - cmd: |
          if [ -n "{{.NAMESPACE}}" ]; then
            {{.KUBECTL}} get namespace "{{.NAMESPACE}}" 2>/dev/null || {{.KUBECTL}} create namespace "{{.NAMESPACE}}"
          fi

  build:
    desc: Returns output from kustomize
    aliases: [kb]
    cmd: kustomize build --enable-helm
    dir: '{{.DIR | default .USER_WORKING_DIR}}'

  build-apply:
    desc: Returns output from kustomize and applies the output using kubectl
    aliases: [kba]
    deps: [_ensure-namespace]
    cmd: kustomize build --enable-helm | {{.KUBECTL}} apply -f -
    dir: '{{.DIR | default .USER_WORKING_DIR}}'

  build-apply-server-side:
    desc: Returns output from kustomize and applies the output using kubectl
    aliases: [kbas]
    deps: [_ensure-namespace]
    cmd: kustomize build --enable-helm | {{.KUBECTL}} apply --server-side -f -
    dir: '{{.DIR | default .USER_WORKING_DIR}}'

  build-delete:
    desc: Returns output from kustomize and deletes the output using kubectl
    aliases: [kbd]
    cmd: kustomize build --enable-helm | {{.KUBECTL}} delete -f -
    dir: '{{.DIR | default .USER_WORKING_DIR}}'

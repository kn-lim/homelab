apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: discord

spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: discord-webhook
    creationPolicy: Owner
  data:
    - secretKey: address
      remoteRef:
        key: discord/webhook_url
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

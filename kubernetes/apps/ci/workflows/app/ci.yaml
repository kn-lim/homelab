apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate

metadata:
  name: ci

spec:
  entrypoint: main
  onExit: status
  synchronization:
    mutexes:
      - name: "ci-{{workflow.parameters.repo}}"
  volumeClaimGC:
    strategy: OnWorkflowCompletion
  podMetadata:
    labels:
      velero.io/exclude-from-backup: "true"
  activeDeadlineSeconds: 3600
  serviceAccountName: argo-workflows
  workflowMetadata:
    labelsFrom:
      ci.knlim.dev/repo:
        expression: sprig.last(sprig.splitList("/", workflow.parameters.repo))
      ci.knlim.dev/branch:
        expression: sprig.replace("/", "-", workflow.parameters.branch)
      ci.knlim.dev/commit:
        expression: sprig.trunc(7, workflow.parameters.after)
  arguments:
    parameters:
      - name: branch
        value: main
      - name: repo
        value: kn-lim/homelab
      - name: before
        value: ""
      - name: after
        value: ""
      - name: commands
        value: "[]"

  volumes:
    - name: mise
      persistentVolumeClaim:
        claimName: mise

  volumeClaimTemplates:
    - metadata:
        name: workdir
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-data-delete
        resources:
          requests:
            storage: 8Gi

  templates:
    - name: main
      dag:
        tasks:
          - name: setup
            templateRef:
              name: command
              template: setup
            arguments:
              parameters:
                - name: repo
                  value: "{{workflow.parameters.repo}}"
                - name: branch
                  value: "{{workflow.parameters.branch}}"
          - name: apply
            dependencies: [setup]
            withParam: "{{workflow.parameters.commands}}"
            templateRef:
              name: command
              template: run
            arguments:
              parameters:
                - name: command
                  value: "{{item}}"

    - name: status
      steps:
        - - name: send-status
            templateRef:
              name: discord
              template: status
            arguments:
              parameters:
                - name: commit
                  value: "{{workflow.parameters.after}}"
                - name: repo
                  value: "{{workflow.parameters.repo}}"
                - name: commands
                  value: "{{workflow.parameters.commands}}"
                - name: trigger
                  value: "{{workflow.annotations.workflows.argoproj.io/description}}"

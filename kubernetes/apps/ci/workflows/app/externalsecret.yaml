apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: environment-variables

spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: environment-variables
    creationPolicy: Owner
  data:
    - secretKey: OP_SERVICE_ACCOUNT_TOKEN
      remoteRef:
        key: op-sa-terraform/credential
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: terraform-aws/aws_access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: terraform-aws/aws_secret_access_key
    - secretKey: CLOUDFLARE_API_TOKEN
      remoteRef:
        key: cloudflare-knlim.dev/credential
    - secretKey: ARGO_WORKFLOWS_URL
      remoteRef:
        key: discord/argo_workflows_url
    - secretKey: DISCORD_ERROR_WEBHOOK_URL
      remoteRef:
        key: discord/alerts-error/homelab_webhook_url
    - secretKey: DISCORD_INFO_WEBHOOK_URL
      remoteRef:
        key: discord/alerts-info/homelab_webhook_url
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: github/token
    - secretKey: GRAFANA_AUTH
      remoteRef:
        key: terraform-grafana/credential
    - secretKey: GRAFANA_URL
      remoteRef:
        key: terraform-grafana/url
    - secretKey: TAILSCALE_OAUTH_CLIENT_ID
      remoteRef:
        key: tailscale-terraform/client_id
    - secretKey: TAILSCALE_OAUTH_CLIENT_SECRET
      remoteRef:
        key: tailscale-terraform/client_secret
    - secretKey: TF_BUCKET
      remoteRef:
        key: terraform-aws/bucket

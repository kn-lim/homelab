apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: otterwiki

spec:
  parentRefs:
    - name: envoy
      namespace: network
      sectionName: https
  hostnames:
    - otterwiki.${LOCAL_DOMAIN}
    - wiki.${LOCAL_DOMAIN}
  rules:
    - backendRefs:
        - name: otterwiki
          port: 80

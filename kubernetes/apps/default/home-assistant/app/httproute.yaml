apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: home-assistant

spec:
  parentRefs:
    - name: envoy
      namespace: network
      sectionName: https
  hostnames:
    - home-assistant.${LOCAL_DOMAIN}
  rules:
    - backendRefs:
        - name: home-assistant
          port: 8123

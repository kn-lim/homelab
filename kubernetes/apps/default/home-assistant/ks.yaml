# The PVCs need the local-data StorageClass from democratic-csi-data.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: home-assistant
  namespace: flux-system

spec:
  dependsOn:
    - name: democratic-csi-data
  interval: 1h
  path: ./kubernetes/apps/default/home-assistant/app
  targetNamespace: default

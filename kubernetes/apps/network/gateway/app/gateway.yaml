apiVersion: gateway.networking.k8s.io/v1
kind: Gateway

metadata:
  name: envoy

spec:
  gatewayClassName: envoy
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: "${LOCAL_VIP}"
  listeners:
    # HTTP to HTTPS redirect only
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: wildcard-tls

apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: operator-oauth

spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: tailscale-kubernetes-operator/client_id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: client_secret
      remoteRef:
        key: tailscale-kubernetes-operator/client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: tailscale-operator

spec:
  chart:
    spec:
      chart: tailscale-operator
      version: 1.104.1
      sourceRef:
        kind: HelmRepository
        name: tailscale
  interval: 1h
  values:
    operatorConfig:
      # The device name carries the cluster name.
      hostname: tailscale-operator-${CLUSTER_NAME}
      podAnnotations:
        secret.reloader.stakater.com/auto: "true"

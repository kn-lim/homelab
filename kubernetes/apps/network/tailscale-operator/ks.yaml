# The operator OAuth client comes from 1Password.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: tailscale-operator
  namespace: flux-system

spec:
  dependsOn:
    - name: onepassword
  interval: 1h
  path: ./kubernetes/apps/network/tailscale-operator/app
  targetNamespace: network
---
# The DNSConfig needs the Tailscale CRDs from the operator chart.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: tailscale-dns
  namespace: flux-system

spec:
  dependsOn:
    - name: tailscale-operator
  interval: 1h
  path: ./kubernetes/apps/network/tailscale-operator/dns
  targetNamespace: network

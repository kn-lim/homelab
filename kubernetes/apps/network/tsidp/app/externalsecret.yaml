apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: tsidp

spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tsidp
    creationPolicy: Owner
  data:
    - secretKey: TS_AUTHKEY
      remoteRef:
        key: tsidp-auth/credential
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

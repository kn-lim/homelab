apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: jellyfin

spec:
  chart:
    spec:
      chart: jellyfin
      version: 3.2.0
      sourceRef:
        kind: HelmRepository
        name: jellyfin
  interval: 1h
  values:
    jellyfin:
      env:
        - name: JELLYFIN_PublishedServerUrl
          value: "https://jellyfin.${LOCAL_DOMAIN}"
    resources:
      limits:
        nvidia.com/gpu: "1"

    persistence:
      config:
        enabled: true
        existingClaim: jellyfin-config
      media:
        enabled: true
        type: hostPath
        hostPath: /var/mnt/media
      cache:
        enabled: true
        type: pvc
        existingClaim: jellyfin-cache

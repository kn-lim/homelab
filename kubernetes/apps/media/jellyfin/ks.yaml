# Jellyfin uses the GPU from the NVIDIA device plugin.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: jellyfin
  namespace: flux-system

spec:
  dependsOn:
    - name: gpu-operator
  interval: 1h
  path: ./kubernetes/apps/media/jellyfin/app
  targetNamespace: media

apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: immich-library

spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: immich-library
  resources:
    requests:
      storage: 10Ti
---
# Velero does not restore this cache.
apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: immich-ml-cache

spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-data
  resources:
    requests:
      storage: 10Gi

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: immich

spec:
  chartRef:
    kind: OCIRepository
    name: immich
  interval: 1h
  values:
    controllers:
      main:
        containers:
          main:
            env:
              REDIS_HOSTNAME: valkey.database.svc.cluster.local

    server:
      controllers:
        main:
          containers:
            main:
              env:
                DB_HOSTNAME: postgres-rw.database.svc.cluster.local
                DB_USERNAME: immich
                DB_DATABASE_NAME: immich
                DB_PASSWORD:
                  valueFrom:
                    secretKeyRef:
                      name: immich-db-secret
                      key: password

    machine-learning:
      controllers:
        main:
          strategy: Recreate
          pod:
            annotations:
              backup.velero.io/backup-volumes-excludes: cache
          containers:
            main:
              resources:
                limits:
                  nvidia.com/gpu: "1"
      persistence:
        cache:
          type: persistentVolumeClaim
          existingClaim: immich-ml-cache

    valkey:
      enabled: false

    immich:
      persistence:
        library:
          existingClaim: immich-library

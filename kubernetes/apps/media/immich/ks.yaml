# The database password comes from 1Password. The machine learning pod uses the GPU from the NVIDIA device plugin.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: immich
  namespace: flux-system

spec:
  dependsOn:
    - name: gpu-operator
    - name: onepassword
  interval: 1h
  path: ./kubernetes/apps/media/immich/app
  targetNamespace: media

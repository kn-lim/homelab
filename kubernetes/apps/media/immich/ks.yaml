# The database password comes from 1Password. The machine learning pod uses the GPU from the NVIDIA device plugin. The PVCs need the local-data StorageClass from democratic-csi-data.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: immich
  namespace: flux-system

spec:
  dependsOn:
    - name: democratic-csi-data
    - name: gpu-operator
    - name: onepassword
    - name: immich-db
  interval: 1h
  path: ./kubernetes/apps/media/immich/app
  targetNamespace: media
---
# The database needs the CNPG Cluster. The role password comes from 1Password.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: immich-db
  namespace: flux-system

spec:
  dependsOn:
    - name: cloudnative-pg-cluster
    - name: onepassword
  interval: 1h
  path: ./kubernetes/apps/media/immich/db
  targetNamespace: database

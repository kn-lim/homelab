# The managed role immich of the Cluster postgres reads its password from this Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: postgres-immich-password

spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: postgres-immich-password
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        username: immich
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: postgres/immich_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

# The managed role romm of the Cluster postgres reads its password from this Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: postgres-romm-password

spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: postgres-romm-password
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        username: romm
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: postgres/romm_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

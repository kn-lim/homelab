# The secrets come from 1Password. Webstation uses the nvidia RuntimeClass from the GPU Operator.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: romm
  namespace: flux-system

spec:
  dependsOn:
    - name: gpu-operator
    - name: onepassword
  interval: 1h
  path: ./kubernetes/apps/media/romm/app
  targetNamespace: media

# The secrets come from 1Password. Webstation uses the nvidia RuntimeClass from the GPU Operator. The PVCs need the local-array and local-data StorageClasses from democratic-csi-array and democratic-csi-data.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: romm
  namespace: flux-system

spec:
  dependsOn:
    - name: democratic-csi-array
    - name: democratic-csi-data
    - name: gpu-operator
    - name: onepassword
    - name: romm-db
  interval: 1h
  path: ./kubernetes/apps/media/romm/app
  targetNamespace: media
---
# The database needs the CNPG Cluster. The role password comes from 1Password.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: romm-db
  namespace: flux-system

spec:
  dependsOn:
    - name: cloudnative-pg-cluster
    - name: onepassword
  interval: 1h
  path: ./kubernetes/apps/media/romm/db
  targetNamespace: database

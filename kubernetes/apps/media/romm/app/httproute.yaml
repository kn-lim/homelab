apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: romm

spec:
  parentRefs:
    - name: envoy
      namespace: network
      sectionName: https
  hostnames:
    - romm.${LOCAL_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /streaming
      backendRefs:
        - name: webstation
          port: 3000
    - backendRefs:
        - name: romm
          port: 8080

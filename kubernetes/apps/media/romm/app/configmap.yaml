apiVersion: v1
kind: ConfigMap

metadata:
  name: romm-config

data:
  config.yml: |
    filesystem:
      structure:
        default: "roms/{platform}/{game}"
        firmware: "bios/{platform}"
    streaming:
      enabled: true
      containers:
        - protocol: webstation
          host: /streaming
          subfolder: /streaming
          broker_host: http://webstation.media.svc.cluster.local:3000
          label: Webstation
          platforms:
            ngc:
              emulator: dolphin
              memory_card_sync: true

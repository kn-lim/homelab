apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool

metadata:
  name: local-pool

spec:
  blocks:
    - cidr: "${LOCAL_VIP}/32"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy

metadata:
  name: local-gateway-policy

spec:
  serviceSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  externalIPs: false
  loadBalancerIPs: true

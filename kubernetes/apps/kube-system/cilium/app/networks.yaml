apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool

metadata:
  name: local-pool

spec:
  blocks:
    - cidr: "${LOCAL_VIP}/32"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy

metadata:
  name: local-gateway-policy

spec:
  # Envoy Gateway sets these labels on the proxy Service of Gateway network/envoy
  serviceSelector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: envoy
      gateway.envoyproxy.io/owning-gateway-namespace: network
  externalIPs: false
  loadBalancerIPs: true

# https://docs.siderolabs.com/kubernetes-guides/monitoring-and-observability/deploy-metrics-server

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # flate cannot render a remote git base, so this is the same deploy/standalone as one file
  - https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/v0.12.1/deploy/standalone-install.yaml

patches:
  - # targetNamespace renames this Namespace to kube-system, without the prune-disabled annotation
    target:
      kind: Namespace
      name: kubelet-serving-cert-approver
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: kubelet-serving-cert-approver
  - target:
      kind: RoleBinding
      name: events:kubelet-serving-cert-approver
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: kube-system
  - target:
      kind: Deployment
      name: kubelet-serving-cert-approver
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 64Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 32Mi

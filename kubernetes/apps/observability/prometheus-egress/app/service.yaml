# This Service sends the remote-write traffic of Alloy to the Prometheus on henesys.
apiVersion: v1
kind: Service

metadata:
  name: prometheus-egress
  annotations:
    # The operator rewrites spec.externalName. Flux creates the Service once and does not reset it.
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    tailscale.com/tailnet-fqdn: prometheus.${TAILSCALE_TAILNET_NAME}.ts.net
    tailscale.com/hostname: prometheus-egress-${CLUSTER_NAME}

spec:
  externalName: placeholder   # will be overwritten by operator
  type: ExternalName

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: kube-state-metrics

spec:
  chartRef:
    kind: OCIRepository
    name: kube-state-metrics
  interval: 1h
  values:
    prometheus:
      monitor:
        enabled: true
        # Community dashboards and rules expect job="kube-state-metrics".
        jobLabel: app.kubernetes.io/name
        http:
          honorLabels: true

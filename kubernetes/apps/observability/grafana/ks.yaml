# The tsidp OIDC client comes from 1Password. The PVCs need the local-data StorageClass from democratic-csi-data.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: grafana
  namespace: flux-system

spec:
  dependsOn:
    - name: democratic-csi-data
    - name: onepassword
  interval: 1h
  path: ./kubernetes/apps/observability/grafana/app
  targetNamespace: observability

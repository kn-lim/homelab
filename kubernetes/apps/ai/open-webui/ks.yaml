# The secret key comes from 1Password. The PVCs need the local-data StorageClass from democratic-csi-data.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: open-webui
  namespace: flux-system

spec:
  dependsOn:
    - name: democratic-csi-data
    - name: onepassword
  interval: 1h
  path: ./kubernetes/apps/ai/open-webui/app
  targetNamespace: ai

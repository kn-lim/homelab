apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: open-webui

spec:
  parentRefs:
    - name: envoy
      namespace: network
      sectionName: https
  hostnames:
    - chat.${LOCAL_DOMAIN}
    - open-webui.${LOCAL_DOMAIN}
  rules:
    - backendRefs:
        - name: open-webui
          port: 80

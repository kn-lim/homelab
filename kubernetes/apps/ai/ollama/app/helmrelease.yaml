apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: ollama

spec:
  chart:
    spec:
      chart: ollama
      version: 1.93.0
      sourceRef:
        kind: HelmRepository
        name: otwld
  interval: 1h
  values:
    runtimeClassName: nvidia
    podAnnotations:
      backup.velero.io/backup-volumes-excludes: ollama-data
    resources:
      limits:
        nvidia.com/gpu: "1"
    ollama:
      gpu:
        enabled: true
        type: nvidia
        number: 1
    persistentVolume:
      enabled: true
      existingClaim: ollama

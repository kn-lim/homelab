apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: cert-manager
  namespace: flux-system

spec:
  interval: 1h
  path: ./kubernetes/apps/cert-manager/cert-manager/app
  targetNamespace: cert-manager
---
# The issuers need the cert-manager CRDs and webhook, and the Cloudflare token from 1Password.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: cert-manager-issuers
  namespace: flux-system

spec:
  dependsOn:
    - name: cert-manager
    - name: onepassword
  interval: 1h
  path: ./kubernetes/apps/cert-manager/cert-manager/issuers
  targetNamespace: cert-manager

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: argo-events

spec:
  chartRef:
    kind: OCIRepository
    name: argo-events
  interval: 1h
  values:
    controller:
      podAnnotations:
        secret.reloader.stakater.com/auto: "true"
        configmap.reloader.stakater.com/auto: "true"
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true

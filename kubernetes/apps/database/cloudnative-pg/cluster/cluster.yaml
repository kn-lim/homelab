apiVersion: postgresql.cnpg.io/v1
kind: Cluster

metadata:
  name: postgres

spec:
  instances: 1
  # A PDB that allows 0 disruptions stalls the node drain of a single-node cluster.
  enablePDB: false
  inheritedMetadata:
    annotations:
      pre.hook.backup.velero.io/container: postgres
      pre.hook.backup.velero.io/command: '["/bin/bash", "-c", "pg_dumpall > /var/lib/postgresql/data/velero-dumpall.sql"]'
      pre.hook.backup.velero.io/timeout: 10m
      backup.velero.io/backup-volumes-excludes: ext-vchord,scratch-data,shm
  monitoring:
    enablePodMonitor: true
  storage:
    size: 50Gi
    storageClass: local-data
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib
        extension_control_path:
          - /usr/share/postgresql/18/
  # The password Secrets come from the <app>-db Kustomizations.
  managed:
    roles:
      - name: immich
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: postgres-immich-password
      - name: romm
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: postgres-romm-password
      - name: vikunja
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: postgres-vikunja-password

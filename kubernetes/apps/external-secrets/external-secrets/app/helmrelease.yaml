apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: external-secrets

spec:
  chartRef:
    kind: OCIRepository
    name: external-secrets
  interval: 1h
  values:
    global:
      podAnnotations:
        secret.reloader.stakater.com/auto: "true"
        configmap.reloader.stakater.com/auto: "true"
    serviceMonitor:
      enabled: true
      # prometheus-operator-crds (a dependsOn) installs the ServiceMonitor CRD; skip the chart's check
      renderMode: alwaysRender

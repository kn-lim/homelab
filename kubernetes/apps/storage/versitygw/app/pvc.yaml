# The buckets and IAM users stay on the array share, so they survive a rebuild.
apiVersion: v1
kind: PersistentVolume

metadata:
  name: versitygw

spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/mnt/kubernetes-array/versitygw
    type: Directory
  claimRef:
    name: versitygw
    namespace: storage
---
apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: versitygw

spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: versitygw
  resources:
    requests:
      storage: 1Ti

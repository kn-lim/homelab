apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: versitygw

spec:
  chartRef:
    kind: OCIRepository
    name: versitygw
  interval: 1h
  values:
    image:
      repository: versity/versitygw
      # renovate: datasource=docker depName=versity/versitygw
      tag: v1.9.0

    strategy:
      type: Recreate

    # The Unraid array share is owned by root.
    podSecurityContext:
      fsGroup: 0
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
      runAsGroup: 0

    auth:
      existingSecret: versitygw-root

    gateway:
      backend:
        type: posix
        args: /mnt/buckets
      port: 7070

    iam:
      enabled: true
      type: internal
      dir: /mnt/iam

    webui:
      s3Prefix: /ui
      apiGateways:
        - https://versitygw.${LOCAL_DOMAIN}

    persistence:
      enabled: true
      create: false
      claimName: versitygw

    # Keeps the existing buckets/ directory on the share.
    extraVolumeMounts:
      - name: data
        mountPath: /mnt/buckets
        subPath: buckets
      - name: tmp
        mountPath: /tmp
    extraVolumes:
      - name: tmp
        emptyDir: {}

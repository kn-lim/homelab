# The bucket credentials and the Kopia password come from 1Password.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: velero
  namespace: flux-system

spec:
  dependsOn:
    - name: onepassword
  interval: 1h
  path: ./kubernetes/apps/storage/velero/app
  targetNamespace: storage

---
# The old credential of the cold-backup location. The old 1Password item has the same name as the old bucket.
# Phase 3 of the Flux migration deletes it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: velero-cold-backup-credentials

spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: velero-cold-backup-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .access_key }}
          aws_secret_access_key={{ .secret_key }}
  data:
    - secretKey: access_key
      remoteRef:
        key: ${VELERO_COLD_BACKUP_BUCKET}/access_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: secret_key
      remoteRef:
        key: ${VELERO_COLD_BACKUP_BUCKET}/secret_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

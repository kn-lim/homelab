apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: velero

spec:
  chart:
    spec:
      chart: velero
      version: 12.2.1
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
  interval: 1h
  values:
    upgradeCRDs: false
    deployNodeAgent: true
    snapshotsEnabled: false
    configuration:
      defaultVolumesToFsBackup: true
      uploaderType: kopia
      backupStorageLocation:
        - name: default
          provider: aws
          bucket: velero-${CLUSTER_NAME}
          default: true
          config:
            region: us-east-1
            s3ForcePathStyle: "true"
            s3Url: ${VELERO_S3_URL}
            publicUrl: https://versitygw.knlim.dev
        # The bucket of the cluster before the rebuild, read only for the cutover restore.
        # Phase 3 of the Flux migration deletes this location.
        - name: cold-backup
          provider: aws
          bucket: ${VELERO_COLD_BACKUP_BUCKET}
          accessMode: ReadOnly
          credential:
            name: velero-cold-backup-credentials
            key: cloud
          config:
            region: us-east-1
            s3ForcePathStyle: "true"
            s3Url: ${VELERO_S3_URL}
            publicUrl: https://versitygw.knlim.dev
    credentials:
      existingSecret: velero-credentials
    initContainers:
      - name: velero-plugin-for-aws
        # renovate: datasource=docker depName=velero/velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.14.4
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - mountPath: /target
            name: plugins
    schedules:
      daily:
        disabled: false
        schedule: "CRON_TZ=America/Los_Angeles 0 3 * * *"
        template:
          ttl: 336h
          defaultVolumesToFsBackup: true
          resourcePolicy:
            kind: configmap
            name: velero-volume-policy
          excludedNamespaces: [storage]

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: gpu-operator

spec:
  chart:
    spec:
      chart: gpu-operator
      version: v26.3.3
      sourceRef:
        kind: HelmRepository
        name: nvidia
  interval: 1h
  values:
    driver:
      enabled: false
    toolkit:
      enabled: false

    hostPaths:
      driverInstallDir: /usr/local

    nfd:
      enabled: true

    devicePlugin:
      config:
        name: time-slicing-config
        default: any

    dcgm:
      enabled: false
    dcgmExporter:
      enabled: true
      serviceMonitor:
        enabled: true
      # The exporter's embedded nv-hostengine needs generous memory headroom
      resources:
        limits:
          memory: 1Gi
          cpu: 200m
        requests:
          memory: 128Mi
          cpu: 50m
    migManager:
      enabled: false

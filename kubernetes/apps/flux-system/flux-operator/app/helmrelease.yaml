apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: flux-operator

spec:
  chartRef:
    kind: OCIRepository
    name: flux-operator
  interval: 1h
  values:
    web:
      # The flux-operator-web Kustomization creates this Secret. Until it exists, only the web UI API is down.
      configSecretName: flux-operator-web-config

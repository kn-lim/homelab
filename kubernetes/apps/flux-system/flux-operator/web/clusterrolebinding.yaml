# The tailnet policy sends groups: ["admin"] for group:admin. No person is named here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: flux-web-admin

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-web-admin

subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: admin

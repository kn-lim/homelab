apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: flux-operator-web-config

spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: flux-operator-web-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # tsidp supports only these three scopes. The impersonation defaults are claims.email and claims.groups.
        config.yaml: |
          apiVersion: web.fluxcd.controlplane.io/v1
          kind: Config
          spec:
            baseURL: https://flux-${CLUSTER_NAME}.${TAILSCALE_TAILNET_NAME}.ts.net
            authentication:
              type: OAuth2
              oauth2:
                provider: OIDC
                clientID: "{{ .client_id }}"
                clientSecret: "{{ .client_secret }}"
                issuerURL: https://idp.${TAILSCALE_TAILNET_NAME}.ts.net
                scopes:
                  - openid
                  - email
                  - profile
                validations:
                  - expression: "has(claims.groups) && 'admin' in claims.groups"
                    message: "user must be in the tailnet group admin"
  data:
    - secretKey: client_id
      remoteRef:
        key: tsidp-flux-${CLUSTER_NAME}/client_id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: client_secret
      remoteRef:
        key: tsidp-flux-${CLUSTER_NAME}/client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

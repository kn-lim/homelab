apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: http-to-https
  namespace: traefik

spec:
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: web
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

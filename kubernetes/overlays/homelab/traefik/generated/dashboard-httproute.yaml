apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: traefik-dashboard
  namespace: traefik

spec:
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: websecure
  hostnames:
    - traefik.knlim.dev
  rules:
    - backendRefs:
        - name: traefik
          port: 8080

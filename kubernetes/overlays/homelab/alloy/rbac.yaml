apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: alloy-metrics-scraping

rules:
  - apiGroups: [""]
    resources: ["nodes/metrics", "nodes/proxy"]
    verbs: ["get"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: alloy-metrics-scraping

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-metrics-scraping

subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: alloy

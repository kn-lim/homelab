apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: jellyfin
  namespace: jellyfin

spec:
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: websecure
  hostnames:
    - jellyfin.knlim.dev
  rules:
    - backendRefs:
        - name: jellyfin
          port: 8096

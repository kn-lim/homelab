apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: jellyfin
  namespace: jellyfin
  annotations:
    tailscale.com/tags: "tag:k8s-jellyfin"

spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: jellyfin
      port:
        number: 8096
  tls:
    - hosts:
        - jellyfin

apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: otterwiki-config
  namespace: otterwiki

spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: otterwiki-config
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: otterwiki/secret_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

apiVersion: apps/v1
kind: Deployment

metadata:
  name: otterwiki

spec:
  template:
    spec:
      initContainers:
        - name: git-clone
          image: alpine/git
          command: ["sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /root/.ssh
              cp /etc/otterwiki-deploy-key/ssh-privatekey /root/.ssh/id_ed25519
              chmod 600 /root/.ssh/id_ed25519
              export GIT_SSH_COMMAND="ssh -i /root/.ssh/id_ed25519 -o StrictHostKeyChecking=no"
              if [ ! -d /app-data/repository/.git ]; then
                git clone git@github.com:kn-lim/homelab-wiki.git /app-data/repository
              fi
          volumeMounts:
            - name: data
              mountPath: /app-data
            - name: deploy-key
              mountPath: /etc/otterwiki-deploy-key
              readOnly: true
      volumes:
        - name: deploy-key
          secret:
            secretName: otterwiki-deploy-key
            defaultMode: 0400

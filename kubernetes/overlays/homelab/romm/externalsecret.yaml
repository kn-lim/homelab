apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: romm-secret
  namespace: romm

spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: romm-secret
    creationPolicy: Owner
  data:
    - secretKey: db-password
      remoteRef:
        key: postgres/romm_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: auth-secret-key
      remoteRef:
        key: romm/auth_secret_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: igdb-client-id
      remoteRef:
        key: romm/igdb_client_id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: igdb-client-secret
      remoteRef:
        key: romm/igdb_client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

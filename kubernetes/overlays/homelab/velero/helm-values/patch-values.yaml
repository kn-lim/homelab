apiVersion: builtin
kind: HelmChartInflationGenerator

metadata:
  name: velero

valuesInline:
  configuration:
    backupStorageLocation:
      - name: default
        provider: aws
        bucket: velero-homelab
        default: true
        config:
          region: us-east-1
          s3ForcePathStyle: "true"
          s3Url: http://versitygw.versitygw.svc.cluster.local:7070
          publicUrl: https://versitygw.knlim.dev
  schedules:
    daily:
      disabled: false
      schedule: "0 3 * * *"
      template:
        ttl: 336h
        defaultVolumesToFsBackup: true
        resourcePolicy:
          kind: configmap
          name: velero-volume-policy
        excludedNamespaces: [velero, versitygw]

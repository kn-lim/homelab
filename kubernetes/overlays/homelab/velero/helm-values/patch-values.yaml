apiVersion: builtin
kind: HelmChartInflationGenerator

metadata:
  name: velero

valuesInline:
  configuration:
    backupStorageLocation:
      - name: default
        provider: aws
        bucket: velero-homelab
        default: true
        config:
          region: us-east-1
          s3ForcePathStyle: "true"
          s3Url: http://versitygw.versitygw.svc.cluster.local:7070

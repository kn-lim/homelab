apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: adguardhome
  namespace: adguardhome

spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
  data:
    - secretKey: TS_AUTHKEY
      remoteRef:
        key: tailscale-adguardhome/credential

apiVersion: builtin
kind: HelmChartInflationGenerator

metadata:
  name: open-webui

valuesInline:
  persistence:
    size: 5Gi

  extraEnvVars:
    - name: WEBUI_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: open-webui-secret
          key: webui-secret-key
    - name: WEBUI_URL
      value: "https://chat.knlim.dev"

  ollama:
    persistentVolume:
      size: 50Gi
    runtimeClassName: nvidia
    resources:
      limits:
        nvidia.com/gpu: 1
    ollama:
      gpu:
        enabled: true
        type: nvidia
        number: 1

apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: argocd-ssh-credentials
  namespace: argocd

spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
  data:
    - secretKey: url
      remoteRef:
        key: argocd-ssh/url
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: sshPrivateKey
      remoteRef:
        key: argocd-ssh/private_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: immich
  namespace: immich

spec:
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: websecure
  hostnames:
    - immich.knlim.dev
    - photos.knlim.dev
  rules:
    - backendRefs:
        - name: immich-server
          port: 2283

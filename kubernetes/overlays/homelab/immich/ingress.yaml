apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: immich
  namespace: immich
  annotations:
    tailscale.com/tags: "tag:k8s-immich"

spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: immich-server
      port:
        number: 2283
  tls:
    - hosts:
        - immich

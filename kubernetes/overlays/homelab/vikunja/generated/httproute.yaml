apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: vikunja
  namespace: vikunja

spec:
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: websecure
  hostnames:
    - vikunja.knlim.dev
  rules:
    - backendRefs:
        - name: vikunja
          port: 3456

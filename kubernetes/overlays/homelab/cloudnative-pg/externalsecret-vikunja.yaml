apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: postgres-vikunja-password
  namespace: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: postgres-vikunja-password
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        username: vikunja
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: postgres/vikunja_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

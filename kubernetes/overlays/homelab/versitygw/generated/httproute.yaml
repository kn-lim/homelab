apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: versitygw
  namespace: versitygw

spec:
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: websecure
  hostnames:
    - versitygw.knlim.dev
  rules:
    - backendRefs:
        - name: versitygw
          port: 7070

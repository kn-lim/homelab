apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: versitygw-root
  namespace: versitygw

spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: versitygw-root
    creationPolicy: Owner
  data:
    - secretKey: rootAccessKeyId
      remoteRef:
        key: versitygw/root_access_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: rootSecretAccessKey
      remoteRef:
        key: versitygw/root_secret_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

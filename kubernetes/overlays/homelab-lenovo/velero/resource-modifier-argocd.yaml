apiVersion: v1
kind: ConfigMap

metadata:
  name: argocd-tracking-strip
  namespace: velero

data:
  modifiers.yaml: |
    version: v1
    resourceModifierRules:
      - conditions:
          groupResource: "*"
        mergePatches:
          - patchData: |
              {
                "metadata": {
                  "annotations": {
                    "argocd.argoproj.io/tracking-id": null
                  }
                }
              }

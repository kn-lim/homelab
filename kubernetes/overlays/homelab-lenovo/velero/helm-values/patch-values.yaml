apiVersion: builtin
kind: HelmChartInflationGenerator

metadata:
  name: velero

valuesInline:
  configuration:
    backupStorageLocation:
      - name: default
        provider: aws
        bucket: velero-homelab-lenovo
        default: true
        config:
          region: us-east-1
          s3ForcePathStyle: "true"
          s3Url: https://versitygw.knlim.dev
          publicUrl: https://versitygw.knlim.dev
  schedules:
    daily:
      disabled: false
      schedule: "CRON_TZ=America/Los_Angeles 0 3 * * *"
      template:
        ttl: 336h
        defaultVolumesToFsBackup: true
        resourcePolicy:
          kind: configmap
          name: velero-volume-policy
        excludedNamespaces: [velero]

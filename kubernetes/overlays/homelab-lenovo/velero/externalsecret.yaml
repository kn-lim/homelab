apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: velero-credentials
  namespace: velero
  annotations:
    argocd.argoproj.io/sync-wave: "-1"

spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: velero-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .access_key }}
          aws_secret_access_key={{ .secret_key }}
  data:
    - secretKey: access_key
      remoteRef:
        key: velero-homelab-lenovo/access_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: secret_key
      remoteRef:
        key: velero-homelab-lenovo/secret_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: velero-repo-credentials
  namespace: velero
  annotations:
    argocd.argoproj.io/sync-wave: "-1"

spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: velero-repo-credentials
    creationPolicy: Owner
  data:
    - secretKey: repository-password
      remoteRef:
        key: velero-homelab-lenovo/repository_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

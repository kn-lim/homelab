apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../bases/adguardhome
  - namespace.yaml
  - pvc.yaml
  - secret.yaml

# TODO: keep AdGuard stopped until the data copy from homelab is done.
# Remove this patch in the cutover commit.
patches:
  - target:
      kind: Deployment
      name: adguardhome
    patch: |
      - op: replace
        path: /spec/replicas
        value: 0

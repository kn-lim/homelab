apiVersion: builtin
kind: HelmChartInflationGenerator

metadata:
  name: home-assistant

valuesInline:
  configuration:
    templateConfig: |-
      default_config:

      homeassistant:
        internal_url: https://home-assistant.homelab-lenovo.knlim.dev
        external_url: https://home-assistant.neon-wyrm.ts.net

      frontend:
        themes: !include_dir_merge_named themes

      automation: !include automations.yaml
      script: !include scripts.yaml
      scene: !include scenes.yaml

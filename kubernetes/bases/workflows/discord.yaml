apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate

metadata:
  name: discord
  namespace: argo-workflows

spec:
  templates:
    - name: status
      inputs:
        parameters:
          - name: status
            default: "{{workflow.status}}"
          - name: workflow-name
            default: "{{workflow.name}}"
          - name: duration
            default: "{{workflow.duration}}"
          - name: failures
            default: "{{workflow.failures}}"
          - name: paths
            default: ""
          - name: commit
            default: ""
          - name: repo
            default: ""
      container:
        image: ghcr.io/kn-lim/toolbox
        envFrom:
          - secretRef:
              name: environment-variables
        command: [sh, -c]
        args:
          - |
            EXTRA_FIELD=""
            if [ -n "{{inputs.parameters.paths}}" ]; then
              EXTRA_FIELD=",{\"name\": \"Paths\", \"value\": \"{{inputs.parameters.paths}}\", \"inline\": false}"
            elif [ -n "{{inputs.parameters.commit}}" ]; then
              COMMIT_SHORT=$(echo "{{inputs.parameters.commit}}" | cut -c1-7)
              if [ -n "{{inputs.parameters.repo}}" ]; then
                GITHUB_REPO=$(echo "{{inputs.parameters.repo}}" | sed 's|git@github.com:||;s|\.git$||')
                COMMIT_VALUE="[${COMMIT_SHORT}](https://github.com/${GITHUB_REPO}/commit/{{inputs.parameters.commit}})"
              else
                COMMIT_VALUE="${COMMIT_SHORT}"
              fi
              EXTRA_FIELD=",{\"name\": \"Commit\", \"value\": \"${COMMIT_VALUE}\", \"inline\": true}"
            fi

            if [ "{{inputs.parameters.status}}" = "Succeeded" ]; then
              COLOR=65280
              EMOJI=":white_check_mark:"
              FAILURES_FIELD=""
            else
              COLOR=16711680
              EMOJI=":x:"
              FAILURES=$(printf '%s' '{{inputs.parameters.failures}}' | jq -r 'fromjson | [.[] | select(.message | length > 0) | "\(.displayName): \(.message)"] | join("\\n")')
              if [ -n "$FAILURES" ]; then
                FAILURES_FIELD=",{\"name\": \"Failures\", \"value\": \"${FAILURES}\", \"inline\": false}"
              else
                FAILURES_FIELD=""
              fi
            fi

            curl -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{
                \"embeds\": [{
                  \"title\": \"$EMOJI Workflow {{inputs.parameters.status}}\",
                  \"url\": \"${ARGO_WORKFLOWS_URL}/workflows/argo-workflows/{{inputs.parameters.workflow-name}}\",
                  \"color\": $COLOR,
                  \"fields\": [
                    {\"name\": \"Workflow\", \"value\": \"{{inputs.parameters.workflow-name}}\", \"inline\": true},
                    {\"name\": \"Status\", \"value\": \"{{inputs.parameters.status}}\", \"inline\": true},
                    {\"name\": \"Duration\", \"value\": \"{{inputs.parameters.duration}}\", \"inline\": true}
                    ${FAILURES_FIELD}
                    ${EXTRA_FIELD}
                  ]
                }]
              }"

apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate

metadata:
  name: discord
  namespace: argo-workflows

spec:
  templates:
    - name: status
      inputs:
        parameters:
          - name: status
            default: "{{workflow.status}}"
          - name: workflow-name
            default: "{{workflow.name}}"
          - name: duration
            default: "{{workflow.duration}}"
          - name: failures
            default: "{{workflow.failures}}"
          - name: paths
            default: ""
          - name: commit
            default: ""
          - name: targets
            default: ""
          - name: repo
      container:
        image: alpine
        envFrom:
          - secretRef:
              name: environment-variables
        command: [sh, -c]
        args:
          - |
            apk add --no-cache curl jq

            TARGETS='{{inputs.parameters.targets}}'
            case "$TARGETS" in *'{{'*) TARGETS="" ;; esac

            # Convert workflow.duration (seconds) to readable format
            D=$(printf '%s' '{{inputs.parameters.duration}}' | cut -d. -f1)
            case "$D" in ''|*[!0-9]*) D=0 ;; esac
            if [ "$D" -ge 3600 ]; then
              DURATION="$((D / 3600))h$(((D % 3600) / 60))m$((D % 60))s"
            elif [ "$D" -ge 60 ]; then
              DURATION="$((D / 60))m$((D % 60))s"
            else
              DURATION="${D}s"
            fi

            FIELDS="{\"name\": \"Workflow\", \"value\": \"{{inputs.parameters.workflow-name}}\", \"inline\": true}"
            FIELDS="${FIELDS},{\"name\": \"Status\", \"value\": \"{{inputs.parameters.status}}\", \"inline\": true}"
            FIELDS="${FIELDS},{\"name\": \"Duration\", \"value\": \"${DURATION}\", \"inline\": true}"
            FIELDS="${FIELDS},{\"name\": \"Repo\", \"value\": \"[{{inputs.parameters.repo}}](https://github.com/{{inputs.parameters.repo}})\", \"inline\": true}"

            if [ -n "{{inputs.parameters.commit}}" ]; then
              COMMIT_SHORT=$(echo "{{inputs.parameters.commit}}" | cut -c1-7)
              FIELDS="${FIELDS},{\"name\": \"Commit\", \"value\": \"[${COMMIT_SHORT}](https://github.com/{{inputs.parameters.repo}}/commit/{{inputs.parameters.commit}})\", \"inline\": true}"
            fi
            if [ -n "{{inputs.parameters.paths}}" ]; then
              FIELDS="${FIELDS},{\"name\": \"Paths\", \"value\": \"{{inputs.parameters.paths}}\", \"inline\": true}"
            fi

            if [ -n "$TARGETS" ]; then
              TARGETS_JSON=$(printf '%s' "$TARGETS" | cut -c1-1000 | jq -Rs .)
              FIELDS="${FIELDS},{\"name\": \"Targets\", \"value\": ${TARGETS_JSON}, \"inline\": false}"
            fi

            if [ "{{inputs.parameters.status}}" = "Succeeded" ]; then
              COLOR=5025616
              THUMBNAIL="https://raw.githubusercontent.com/kn-lim/kn-lim/refs/heads/main/homelab/success.png"
            else
              COLOR=16007990
              THUMBNAIL="https://raw.githubusercontent.com/kn-lim/kn-lim/refs/heads/main/homelab/error.png"
              FAILURES_TEXT=$(printf '%s' '{{inputs.parameters.failures}}' | jq -r 'fromjson | [.[] | select(.message | length > 0) | "\(.displayName) (\(.templateName))\n\(.message)"] | join("\n\n")' 2>/dev/null || true)
              if [ -n "$FAILURES_TEXT" ]; then
                FAILURES_JSON=$(printf '%s' "$FAILURES_TEXT" | head -c 1000 | jq -Rs .)
                FIELDS="${FIELDS},{\"name\": \"Failures\", \"value\": ${FAILURES_JSON}, \"inline\": false}"
              fi
            fi

            curl -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{
                \"embeds\": [{
                  \"title\": \"Workflow {{inputs.parameters.status}}\",
                  \"url\": \"${ARGO_WORKFLOWS_URL}/workflows/argo-workflows/{{inputs.parameters.workflow-name}}\",
                  \"color\": ${COLOR},
                  \"thumbnail\": {\"url\": \"${THUMBNAIL}\"},
                  \"fields\": [${FIELDS}]
                }]
              }"

apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate

metadata:
  name: ci
  namespace: argo-workflows

spec:
  entrypoint: main
  onExit: status
  synchronization:
    mutexes:
      - name: "ci-{{workflow.parameters.repo}}"
  ttlStrategy:
    secondsAfterCompletion: 259200
  volumeClaimGC:
    strategy: OnWorkflowCompletion
  activeDeadlineSeconds: 3600
  serviceAccountName: argo-workflows
  workflowMetadata:
    labelsFrom:
      homelab.knlim.dev/repo:
        expression: sprig.last(sprig.splitList("/", workflow.parameters.repo))
      homelab.knlim.dev/branch:
        expression: sprig.replace("/", "-", workflow.parameters.branch)
      homelab.knlim.dev/commit:
        expression: sprig.trunc(7, workflow.parameters.after)
  arguments:
    parameters:
      - name: branch
        value: main
      - name: repo
        value: kn-lim/homelab
      - name: before
        value: ""
      - name: after
        value: ""
      - name: paths
        value: ""

  volumes:
    - name: ssh-key
      secret:
        secretName: argo-workflows-ssh-key
        defaultMode: 0400

  volumeClaimTemplates:
    - metadata:
        name: workdir
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-data-delete
        resources:
          requests:
            storage: 8Gi

  templates:
    - name: main
      dag:
        tasks:
          - name: git-clone
            templateRef:
              name: git
              template: clone
            arguments:
              parameters:
                - name: repo
                  value: "{{workflow.parameters.repo}}"
                - name: branch
                  value: "{{workflow.parameters.branch}}"
          - name: changes
            dependencies: [git-clone]
            templateRef:
              name: command
              template: changes
            arguments:
              parameters:
                - name: before
                  value: "{{workflow.parameters.before}}"
                - name: after
                  value: "{{workflow.parameters.after}}"
                - name: paths
                  value: "{{workflow.parameters.paths}}"
          - name: setup
            dependencies: [git-clone]
            templateRef:
              name: command
              template: setup
          - name: parse
            dependencies: [changes, setup]
            templateRef:
              name: command
              template: parse
            arguments:
              parameters:
                - name: paths
                  value: "{{tasks.changes.outputs.result}}"
          - name: apply
            dependencies: [parse]
            withParam: "{{tasks.parse.outputs.result}}"
            templateRef:
              name: command
              template: run
            arguments:
              parameters:
                - name: command
                  value: "{{item.command}}"

    - name: status
      steps:
        - - name: send-status
            templateRef:
              name: discord
              template: status
            arguments:
              parameters:
                - name: paths
                  value: "{{workflow.parameters.paths}}"
                - name: commit
                  value: "{{workflow.parameters.after}}"
                - name: repo
                  value: "{{workflow.parameters.repo}}"

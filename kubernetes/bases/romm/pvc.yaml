apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: romm-resources
  namespace: romm

spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 20Gi
  volumeName: romm-resources
---
apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: romm-config
  namespace: romm

spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 1Gi
  volumeName: romm-config
---
apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: romm-assets
  namespace: romm

spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 5Gi
  volumeName: romm-assets

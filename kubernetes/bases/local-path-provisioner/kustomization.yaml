apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # renovate: datasource=github-releases depName=rancher/local-path-provisioner
  - github.com/rancher/local-path-provisioner/deploy?ref=v0.0.36

patches:
  # https://docs.siderolabs.com/kubernetes-guides/csi/local-storage#local-path-provisioner
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: local-path-storage
        labels:
          pod-security.kubernetes.io/enforce: privileged
  - target:
      kind: ConfigMap
      name: local-path-config
    patch: |-
      - op: replace
        path: /data/config.json
        value: |
          {
            "nodePathMap":[
              {
                "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
                "paths":["/var/mnt/local-path-provisioner"]
              }
            ]
          }

apiVersion: builtin
kind: HelmChartInflationGenerator

metadata:
  name: velero

name: velero
# renovate: datasource=helm depName=velero repository=https://vmware-tanzu.github.io/helm-charts
version: 12.2.1
releaseName: velero
namespace: velero
repo: https://vmware-tanzu.github.io/helm-charts
includeCRDs: true

valuesInline:
  upgradeCRDs: false
  deployNodeAgent: true
  snapshotsEnabled: false
  configuration:
    defaultVolumesToFsBackup: true
    uploaderType: kopia
  credentials:
    existingSecret: velero-credentials
  initContainers:
    - name: velero-plugin-for-aws
      # renovate: datasource=docker depName=velero/velero-plugin-for-aws
      image: velero/velero-plugin-for-aws:v1.14.4
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - mountPath: /target
          name: plugins

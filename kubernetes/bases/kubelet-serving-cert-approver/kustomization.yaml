# https://docs.siderolabs.com/kubernetes-guides/monitoring-and-observability/deploy-metrics-server

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kubelet-serving-cert-approver

resources:
  - github.com/alex1989hu/kubelet-serving-cert-approver/deploy/standalone?ref=v0.12.0

patches:
  - target:
      kind: RoleBinding
      name: events:kubelet-serving-cert-approver
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: kubelet-serving-cert-approver
  - target:
      kind: Deployment
      name: kubelet-serving-cert-approver
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 64Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 32Mi

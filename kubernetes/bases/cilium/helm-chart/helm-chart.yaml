apiVersion: builtin
kind: HelmChartInflationGenerator

metadata:
  name: cilium

name: cilium
# renovate: datasource=helm depName=cilium repository=https://helm.cilium.io/
version: 1.20.1
releaseName: cilium
namespace: kube-system
repo: https://helm.cilium.io/
includeCRDs: true
valuesInline:
  # https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium
  kubeProxyReplacement: true

  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE

  cgroup:
    autoMount:
      enabled: false
    hostRoot: /sys/fs/cgroup

  k8sServiceHost: localhost
  k8sServicePort: 7445

  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      # Kustomize helm inflation cannot see cluster CRDs; skip the chart's check
      trustCRDsExist: true

  operator:
    prometheus:
      serviceMonitor:
        enabled: true

  hubble:
    metrics:
      enabled:
        - dns
        - drop
        - tcp
        - flow
        - icmp
        - httpV2
      serviceMonitor:
        enabled: true

apiVersion: builtin
kind: HelmChartInflationGenerator

metadata:
  name: kube-state-metrics

name: kube-state-metrics
# renovate: datasource=helm depName=kube-state-metrics repository=https://prometheus-community.github.io/helm-charts
version: 8.5.0
releaseName: kube-state-metrics
namespace: kube-state-metrics
repo: https://prometheus-community.github.io/helm-charts
includeCRDs: true
valuesInline:
  prometheus:
    monitor:
      enabled: true
      # Community dashboards and rules expect job="kube-state-metrics".
      jobLabel: app.kubernetes.io/name
      http:
        honorLabels: true

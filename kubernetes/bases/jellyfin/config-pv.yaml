apiVersion: v1
kind: PersistentVolume

metadata:
  name: jellyfin-config

spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: ""
  hostPath:
    path: /var/mnt/kubernetes-data/jellyfin/config
    type: DirectoryOrCreate

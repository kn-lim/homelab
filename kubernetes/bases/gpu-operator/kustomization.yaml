apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: gpu-operator
    repo: https://helm.ngc.nvidia.com/nvidia
    version: v26.3.3
    releaseName: gpu-operator
    namespace: gpu-operator
    includeCRDs: true
    valuesInline:
      driver:
        enabled: false
      toolkit:
        enabled: false

      hostPaths:
        driverInstallDir: /usr/local

      nfd:
        enabled: true

      devicePlugin:
        config:
          name: time-slicing-config
          default: any

      dcgm:
        enabled: false
      dcgmExporter:
        enabled: true
        serviceMonitor:
          enabled: true
        resources:
          limits:
            memory: 256Mi
            cpu: 200m
          requests:
            memory: 64Mi
            cpu: 50m
      migManager:
        enabled: false

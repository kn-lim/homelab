apiVersion: builtin
kind: HelmChartInflationGenerator

metadata:
  name: argocd

name: argo-cd
# renovate: datasource=helm depName=argo-cd repository=https://argoproj.github.io/argo-helm
version: 10.2.1
releaseName: argocd
namespace: argocd
repo: https://argoproj.github.io/argo-helm
includeCRDs: true
# Kustomize helm inflation cannot see cluster CRDs; the chart guards its
# ServiceMonitors behind .Capabilities.APIVersions, so declare it explicitly
apiVersions:
  - monitoring.coreos.com/v1
valuesInline:
  global:
    podAnnotations:
      secret.reloader.stakater.com/auto: "true"
      configmap.reloader.stakater.com/auto: "true"

  configs:
    cm:
      kustomize.buildOptions: "--enable-helm"

  controller:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  server:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  repoServer:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  applicationSet:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  notifications:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  redis:
    enabled: true

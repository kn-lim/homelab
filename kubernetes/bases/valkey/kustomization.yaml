apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: valkey
    repo: https://valkey.io/valkey-helm/
    version: 0.11.0
    releaseName: valkey
    namespace: valkey
    includeCRDs: true
    valuesInline:
      fullnameOverride: valkey-primary

      image:
        # renovate: datasource=docker depName=valkey/valkey
        tag: "9.1.1"

      resources:
        limits:
          memory: 256Mi
          cpu: 250m
        requests:
          memory: 64Mi
          cpu: 50m

      metrics:
        enabled: true
        exporter:
          image:
            # renovate: datasource=docker depName=ghcr.io/oliver006/redis_exporter
            tag: "v1.88.0"
          resources:
            limits:
              memory: 128Mi
              cpu: 100m
            requests:
              memory: 32Mi
              cpu: 25m
        serviceMonitor:
          enabled: true

patches:
  - target:
      kind: .*
    patch: |
      - op: add
        path: /metadata/namespace
        value: valkey

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: valkey
    repo: https://charts.bitnami.com/bitnami
    version: 6.2.4
    releaseName: valkey
    namespace: valkey
    includeCRDs: true
    valuesInline:
      architecture: standalone

      auth:
        enabled: false

      primary:
        persistence:
          enabled: false
        resources:
          limits:
            memory: 256Mi
            cpu: 250m
          requests:
            memory: 64Mi
            cpu: 50m

      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
        resources:
          limits:
            memory: 128Mi
            cpu: 100m
          requests:
            memory: 32Mi
            cpu: 25m

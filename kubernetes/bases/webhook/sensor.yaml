apiVersion: argoproj.io/v1alpha1
kind: Sensor

metadata:
  name: webhook
  namespace: webhook

spec:
  eventBusName: webhook
  template:
    serviceAccountName: argo-events-webhook

  dependencies:
    - name: sqs-dep
      eventSourceName: webhook
      eventName: homelab-ci

  triggers:
    - template:
        name: submit-ci-workflow
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: ci-
                namespace: argo-workflows
              spec:
                workflowTemplateRef:
                  name: ci
                arguments:
                  parameters:
                    - name: repo
                      value: ""
                    - name: branch
                      value: ""
                    - name: before
                      value: ""
                    - name: after
                      value: ""
                    - name: paths
                      value: ""
          parameters:
            - src:
                dependencyName: sqs-dep
                dataKey: body.repo
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: sqs-dep
                dataKey: body.ref
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: sqs-dep
                dataKey: body.before
                value: ""
              dest: spec.arguments.parameters.2.value
            - src:
                dependencyName: sqs-dep
                dataKey: body.after
                value: ""
              dest: spec.arguments.parameters.3.value
            - src:
                dependencyName: sqs-dep
                dataKey: body.paths
                value: ""
              dest: spec.arguments.parameters.4.value
            - src:
                dependencyName: sqs-dep
                dataTemplate: 'ci-{{ .Input.body.repo | splitList "/" | last }}-'
              dest: metadata.generateName
            - src:
                dependencyName: sqs-dep
                dataTemplate: '**{{ .Input.body.repo }}** `{{ .Input.body.ref }}` @ {{ .Input.body.after | trunc 7 }}'
              dest: metadata.annotations.workflows\.argoproj\.io/title
            - src:
                dependencyName: sqs-dep
                dataTemplate: 'Commit range `{{ .Input.body.before | trunc 7 }}..{{ .Input.body.after | trunc 7 }}`'
              dest: metadata.annotations.workflows\.argoproj\.io/description

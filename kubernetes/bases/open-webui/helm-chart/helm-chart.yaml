apiVersion: builtin
kind: HelmChartInflationGenerator

metadata:
  name: open-webui

name: open-webui
# renovate: datasource=helm depName=open-webui repository=https://helm.openwebui.com
version: 15.2.1
releaseName: open-webui
namespace: open-webui
repo: https://helm.openwebui.com
includeCRDs: true
valuesInline:
  ollama:
    enabled: false

  ollamaUrls:
    - http://ollama.ollama.svc.cluster.local:11434

  persistence:
    enabled: true
    storageClass: local-data

  enableOpenaiApi: false

  pipelines:
    enabled: false

  websocket:
    enabled: true
    manager: redis
    url: "redis://valkey-primary.valkey.svc.cluster.local:6379"
    redis:
      enabled: false
